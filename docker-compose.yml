services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fmv_comercial
      POSTGRES_USER: fmv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fmv_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./sql/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmv -d fmv_comercial"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_URL: postgres://fmv:${POSTGRES_PASSWORD:-fmv_local}@postgres:5432/fmv_comercial
      JWT_SECRET: ${JWT_SECRET:-desarrollo-local-cambie-esta-clave-32-caracteres}
      JWT_EXPIRES_IN: 7d
      JWT_ISSUER: ${JWT_ISSUER:-fmv-infrasec}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-fmv-portales}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:4100}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fmvinfrasec.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminFMV2026!}
      SA_EMAIL: ${SA_EMAIL:-sa@fmvinfrasec.local}
      SA_PASSWORD: ${SA_PASSWORD:-CambiarSA2026!}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-FMV InfraSec <no-reply@fmvinfrasec.local>}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-local}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-cambie-este-secreto}
    ports:
      - "${APP_PORT:-4100}:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
