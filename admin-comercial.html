<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM comercial | FMV InfraSec</title>
<style>:root{--bg:#050a12;--panel:#0c1725;--line:#20364a;--text:#e8f4f7;--muted:#91a9b6;--cyan:#20ced3;--green:#55df8c;--red:#ff7586}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Segoe UI,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 4vw;border-bottom:1px solid var(--line)}a{color:var(--cyan)}main{width:min(1400px,94vw);margin:30px auto}.login{max-width:420px;margin:10vh auto}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat strong{display:block;color:var(--cyan);font-size:1.5rem}.stat span{color:var(--muted)}input,select,textarea,button{background:#07111c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit}button{cursor:pointer}button.primary{background:var(--cyan);color:#021014;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}.tabs{display:flex;gap:8px;margin:22px 0}.tab.active{background:var(--cyan);color:#021014}.board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:12px;overflow:auto}.column{background:#07111c;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:260px}.column h3{text-transform:capitalize;color:var(--cyan)}.deal{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px}.deal small{color:var(--muted)}.deal input,.deal select{width:100%;margin-top:6px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--cyan)}dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(650px,92vw)}dialog::backdrop{background:#000b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid textarea{grid-column:1/-1;min-height:100px}.msg{color:var(--red)}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr}.formgrid textarea{grid-column:auto}}</style></head>
<body><header><strong>FMV InfraSec · CRM comercial</strong><a href="portal-comercial.html">Portal cliente</a></header><main>
<section id="login" class="card login"><h1>Acceso administrativo</h1><p>Ingrese con un usuario cuyo rol sea administrador.</p><div class="row"><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña"><button class="primary" onclick="login()">Ingresar</button></div><p class="msg" id="loginMsg"></p></section>
<section id="app" class="hidden"><div class="row" style="justify-content:space-between"><h1>Operación comercial</h1><button onclick="logout()">Cerrar sesión</button></div><div class="stats" id="stats"></div><div class="tabs"><button class="tab active" onclick="view('pipeline',this)">Embudo</button><button class="tab" onclick="view('quotes',this)">Cotizaciones</button><button class="tab" onclick="view('payments',this)">Pagos</button><button class="tab" onclick="view('prices',this)">Valores</button><button class="tab" onclick="view('communications',this)">Comunicaciones</button></div><section class="card" id="content"></section></section>
</main>
<dialog id="quoteDialog"><h2>Nueva cotización</h2><form id="quoteForm" class="formgrid"><input id="quoteOpportunity" type="hidden"><input id="quoteSubtotal" type="number" min="0" placeholder="Subtotal COP" required><input id="quoteTax" type="number" min="0" value="0" placeholder="Impuestos"><input id="quoteValid" type="date" required><select id="quoteSend"><option value="true">Crear y enviar</option><option value="false">Solo borrador</option></select><textarea id="quoteScope" placeholder="Alcance de la propuesta" required></textarea><textarea id="quoteTerms" placeholder="Condiciones comerciales"></textarea><button type="button" onclick="quoteDialog.close()">Cancelar</button><button class="primary">Crear cotización</button></form></dialog>
<dialog id="messageDialog"><h2>Notificar cliente</h2><form id="messageForm" class="formgrid"><input id="messageOpportunity" type="hidden"><select id="messageChannel"><option value="ambos">Correo y WhatsApp</option><option value="email">Correo</option><option value="whatsapp">WhatsApp</option></select><input id="messageSubject" placeholder="Asunto"><textarea id="messageBody" placeholder="Mensaje" required></textarea><button type="button" onclick="messageDialog.close()">Cancelar</button><button class="primary">Enviar</button></form></dialog>
<script>
const API='/api';let token=sessionStorage.getItem('fmv_token'),user=JSON.parse(sessionStorage.getItem('fmv_user')||'null'),crm=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),money=v=>Number(v||0).toLocaleString('es-CO',{style:'currency',currency:'COP'});
async function api(r,o={}){const response=await fetch(API+r,{...o,headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`}}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Error de operación');return data}
async function login(){try{const d=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);return d});if(d.usuario.rol!=='admin')throw Error('Este usuario no tiene rol administrativo.');token=d.token;user=d.usuario;sessionStorage.setItem('fmv_token',token);sessionStorage.setItem('fmv_user',JSON.stringify(user));start()}catch(e){$('loginMsg').textContent=e.message}}
function logout(){sessionStorage.removeItem('fmv_token');sessionStorage.removeItem('fmv_user');location.reload()}
async function start(){if(!token||user?.rol!=='admin')return;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}
async function load(){try{const [summary,data]=await Promise.all([api('/admin/resumen'),api('/admin/crm')]);crm=data;$('stats').innerHTML=[['Clientes',summary.clientes],['Productos',summary.productos],['Oportunidades',summary.asesorias],['Próximas',summary.proximas],['Pipeline',money(summary.pipeline)],['Ingresos',money(summary.ingresos)]].map(x=>`<div class="card stat"><strong>${esc(x[1])}</strong><span>${x[0]}</span></div>`).join('');renderPipeline()}catch(e){logout()}}
function view(name,button){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));button.classList.add('active');({pipeline:renderPipeline,quotes:renderQuotes,payments:renderPayments,prices:renderPrices,communications:renderCommunications}[name])()}
function renderPipeline(){const stages=['nuevo','calificado','propuesta','negociacion','ganado','perdido'];$('content').innerHTML=`<div class="board">${stages.map(stage=>`<div class="column"><h3>${stage}</h3>${crm.oportunidades.filter(o=>o.etapa===stage).map(o=>`<article class="deal"><strong>${esc(o.empresa)}</strong><br>${esc(o.producto)}<br><small>${esc(o.cliente)} · ${money(o.valor_estimado)}</small><select onchange="updateDeal('${o.id}',this.value)">${stages.map(s=>`<option ${s===o.etapa?'selected':''}>${s}</option>`).join('')}</select><input type="number" value="${o.valor_estimado||''}" placeholder="Valor" onchange="updateValue('${o.id}',this.value)"><div class="row"><button onclick="openQuote('${o.id}')">Cotizar</button><button onclick="openMessage('${o.id}')">Notificar</button></div></article>`).join('')}</div>`).join('')}</div>`}
async function updateDeal(id,etapa){await api(`/admin/asesorias/${id}/crm`,{method:'PATCH',body:JSON.stringify({etapa})});await load()}async function updateValue(id,value){await api(`/admin/asesorias/${id}/crm`,{method:'PATCH',body:JSON.stringify({valor_estimado:Number(value)})});await load()}
function openQuote(id){$('quoteOpportunity').value=id;const d=new Date();d.setDate(d.getDate()+15);$('quoteValid').value=d.toISOString().slice(0,10);quoteDialog.showModal()}function openMessage(id){$('messageOpportunity').value=id;messageDialog.showModal()}
$('quoteForm').onsubmit=async e=>{e.preventDefault();await api('/admin/cotizaciones',{method:'POST',body:JSON.stringify({asesoria_id:$('quoteOpportunity').value,subtotal:Number($('quoteSubtotal').value),impuestos:Number($('quoteTax').value),vigencia_hasta:$('quoteValid').value,alcance:$('quoteScope').value,condiciones:$('quoteTerms').value,enviar:$('quoteSend').value==='true'})});quoteDialog.close();e.target.reset();await load()};
$('messageForm').onsubmit=async e=>{e.preventDefault();await api(`/admin/notificar/${$('messageOpportunity').value}`,{method:'POST',body:JSON.stringify({canal:$('messageChannel').value,asunto:$('messageSubject').value,mensaje:$('messageBody').value})});messageDialog.close();e.target.reset();await load()};
function renderQuotes(){$('content').innerHTML=`<table class="table"><thead><tr><th>Número</th><th>Cliente</th><th>Servicio</th><th>Total</th><th>Estado</th><th>PDF</th></tr></thead><tbody>${crm.cotizaciones.map(q=>`<tr><td>${esc(q.numero)}</td><td>${esc(q.empresa)}<br><small>${esc(q.cliente)}</small></td><td>${esc(q.producto)}</td><td>${money(q.total)}</td><td>${esc(q.estado)}</td><td><button onclick="downloadPdf('${q.id}','${esc(q.numero)}')">Descargar</button></td></tr>`).join('')}</tbody></table>`}
function renderPayments(){$('content').innerHTML=`<h2>Validación de pagos</h2><p>Confirme el ingreso del dinero antes de aprobar. Para rechazar se solicitará un motivo.</p><table class="table"><thead><tr><th>Referencia y fecha</th><th>Cliente</th><th>Monto</th><th>Método</th><th>Estado</th></tr></thead><tbody>${crm.pagos.map(p=>`<tr><td>${esc(p.referencia)}<br><small>${new Date(p.creado_en).toLocaleString('es-CO')}</small></td><td>${esc(p.empresa)}<br>${esc(p.cliente)}</td><td>${money(p.monto)}</td><td>${esc(p.metodo)}</td><td><select onchange="updatePayment('${p.id}',this.value)">${['pendiente','en_validacion','aprobado','rechazado','reembolsado'].map(s=>`<option value="${s}" ${s===p.estado?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select>${p.nota_validacion?`<br><small>${esc(p.nota_validacion)}</small>`:''}</td></tr>`).join('')}</tbody></table>`}async function updatePayment(id,estado){const nota=estado==='rechazado'?prompt('Motivo del rechazo:'):'';if(estado==='rechazado'&&!nota){await load();return}await api(`/admin/pagos/${id}`,{method:'PATCH',body:JSON.stringify({estado,nota})});await load()}
function renderPrices(){$('content').innerHTML=`<h2>Valores del portafolio</h2><p>Estos precios se muestran al cliente como valores “desde”. Déjelo vacío cuando el servicio requiera cotización según alcance.</p><table class="table"><thead><tr><th>Producto o servicio</th><th>Categoría</th><th>Valor desde (COP)</th><th>Acción</th></tr></thead><tbody>${crm.productos.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.categoria)}</td><td><input id="price-${p.id}" type="number" min="0" step="1000" value="${p.precio_desde??''}" placeholder="Según alcance"></td><td><button class="primary" onclick="savePrice('${p.id}')">Guardar</button></td></tr>`).join('')}</tbody></table>`}async function savePrice(id){const value=$(`price-${id}`).value;await api(`/admin/productos/${id}/precio`,{method:'PATCH',body:JSON.stringify({precio_desde:value})});await load();alert('Valor actualizado.')}
function renderCommunications(){$('content').innerHTML=`<table class="table"><thead><tr><th>Fecha</th><th>Canal</th><th>Destino</th><th>Mensaje</th><th>Estado</th></tr></thead><tbody>${crm.comunicaciones.map(c=>`<tr><td>${new Date(c.creado_en).toLocaleString('es-CO')}</td><td>${esc(c.canal)}</td><td>${esc(c.destino)}</td><td>${esc(c.asunto||c.mensaje).slice(0,100)}</td><td>${esc(c.estado)}</td></tr>`).join('')}</tbody></table>`}async function downloadPdf(id,number){const r=await fetch(`/api/cotizaciones/${id}/pdf`,{headers:{Authorization:`Bearer ${token}`}}),blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${number}.pdf`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}start();
</script></body></html>
